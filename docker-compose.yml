version: "3.8"

services:
  bdc2026:
    image: bdc2026:latest
    container_name: bdc2026
    volumes:
      - ./app/data:/app/data
      - ./app/output:/app/output
      - ./app/temp:/app/temp
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true
